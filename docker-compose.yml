version: '3.8'

services:
  outreach-engine:
    build: .
    container_name: cold_outreach_engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/data
      # Optional: set credentials to password-protect the public dashboard
      - DASHBOARD_USERNAME=admin
      - DASHBOARD_PASSWORD=ChangeMeStrongPassword!
    volumes:
      # Persistent storage volume for leads.db, accounts.json, and settings.json
      - ./data:/data
